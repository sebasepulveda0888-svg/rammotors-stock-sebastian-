<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAM MOTORS | Stock Sebastián</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    header p {
      color: #ccc;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .search {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .search input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .stock-info {
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    .vehicles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .vehicle {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .vehicle img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #ddd;
    }

    .vehicle-info {
      padding: 18px;
    }

    .vehicle h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .vehicle p {
      margin: 6px 0;
      color: #555;
    }

    .price {
      font-size: 21px;
      font-weight: bold;
      margin: 15px 0;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #333;
    }

    .mensaje {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      color: #666;
    }

    footer {
      text-align: center;
      padding: 30px;
      margin-top: 40px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h1>🚗 RAM MOTORS</h1>
  <p>Stock Sebastián Sepúlveda</p>
</header>

<div class="container">

  <div class="search">
    <input
      type="text"
      id="buscador"
      placeholder="🔎 Buscar marca, modelo o año..."
      onkeyup="buscarVehiculo()"
    >
  </div>

  <div class="stock-info">
    🚗 Vehículos disponibles:
    <span id="cantidad">0</span>
  </div>

  <div class="vehicles" id="vehiculos"></div>

</div>

<footer>
  RAM MOTORS · Stock Sebastián Sepúlveda
</footer>

<script>

let stock = [];

async function cargarStock() {

  try {

    const respuesta = await fetch("stock.json");

    if (!respuesta.ok) {
      throw new Error("No se pudo cargar stock.json");
    }

    stock = await respuesta.json();

    mostrarVehiculos(stock);

  } catch (error) {

    console.error(error);

    document.getElementById("vehiculos").innerHTML = `
      <div class="mensaje">
        ⚠️ No se pudo cargar el stock.
      </div>
    `;

  }

}


function mostrarVehiculos(vehiculos) {

  const contenedor = document.getElementById("vehiculos");

  contenedor.innerHTML = "";

  document.getElementById("cantidad").textContent = vehiculos.length;

  if (vehiculos.length === 0) {

    contenedor.innerHTML = `
      <div class="mensaje">
        🚗 No hay vehículos cargados todavía.
      </div>
    `;

    return;
  }


  vehiculos.forEach(function(vehiculo) {

    const tarjeta = document.createElement("div");

    tarjeta.className = "vehicle";

    tarjeta.setAttribute(
      "data-search",
      `
      ${vehiculo.marca || ""}
      ${vehiculo.modelo || ""}
      ${vehiculo.año || ""}
      ${vehiculo.version || ""}
      `.toLowerCase()
    );


    tarjeta.innerHTML = `

      <img
        src="${vehiculo.imagen || "https://via.placeholder.com/600x400?text=Ram+Motors"}"
        alt="${vehiculo.marca || ""} ${vehiculo.modelo || ""}"
      >

      <div class="vehicle-info">

        <h2>
          ${vehiculo.marca || ""}
          ${vehiculo.modelo || ""}
          ${vehiculo.año || ""}
        </h2>

        <p>⚙️ ${vehiculo.transmision || "No informado"}</p>

        <p>⛽ ${vehiculo.combustible || "No informado"}</p>

        <p>📏 ${vehiculo.km || "No informado"} km</p>

        <div class="price">
          ${vehiculo.precio || "Precio consultar"}
        </div>

        <button onclick='generarPublicacion(${JSON.stringify(vehiculo)})'>
          🤖 Generar publicación
        </button>

      </div>
    `;

    contenedor.appendChild(tarjeta);

  });

}


function buscarVehiculo() {

  const texto = document
    .getElementById("buscador")
    .value
    .toLowerCase();

  const vehiculos = document.querySelectorAll(".vehicle");

  let encontrados = 0;

  vehiculos.forEach(function(vehiculo) {

    const datos = vehiculo
      .getAttribute("data-search")
      .toLowerCase();

    if (datos.includes(texto)) {

      vehiculo.style.display = "block";
      encontrados++;

    } else {

      vehiculo.style.display = "none";

    }

  });

  document.getElementById("cantidad").textContent = encontrados;

}


function generarPublicacion(vehiculo) {

  const texto = `

Un vehículo cómodo, económico y versátil, ideal para la ciudad y el uso diario. 🚙✨

➕5️⃣6️⃣9️⃣4️⃣5️⃣9️⃣9️⃣6️⃣4️⃣4️⃣3️⃣
👔Ejecutivo Sebastián Sepúlveda

**${vehiculo.marca || ""} ${vehiculo.modelo || ""} ${vehiculo.año || ""} ${vehiculo.version || ""}**

☑️Motor ${vehiculo.motor || "No informado"}
☑️Transmisión ${vehiculo.transmision || "No informado"}
☑️${vehiculo.km || "No informado"} KM
☑️${vehiculo.combustible || "No informado"}

💲${vehiculo.precio || "Consultar"}-. precio crédito
💲${vehiculo.precioContado || "Consultar"}-. precio contado

📌Financiamiento automotriz
📌Recibimos vehículos en parte de pago
📌Compras y consignación

❗️Más de 130 vehículos en stock

📍Claro Solar #333 Temuco

  `.trim();

  navigator.clipboard.writeText(texto);

  alert("✅ Publicación copiada al portapapeles");

}


cargarStock();

</script>

</body>
</html>
